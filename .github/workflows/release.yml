name: Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.1)'
        required: true
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pre-built APK exists
        run: |
          test -f dist/AsiaUSTrader-debug.apk
          ls -lh dist/AsiaUSTrader-debug.apk

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/heads/release-v* ]]; then
            TAG="${GITHUB_REF#refs/heads/release-}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="manual-$(date -u +%Y%m%d-%H%M%S)"
          fi
          OUT="dist/AsiaUSTrader-${TAG}.apk"
          cp dist/AsiaUSTrader-debug.apk "${OUT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsiaUSTrader-${{ steps.meta.outputs.tag }}
          path: ${{ steps.meta.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Asia → US Trader ${{ steps.meta.outputs.tag }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.meta.outputs.apk_path }}
          generate_release_notes: true
          body: |
            **Asia → US Trader** debug build (pre-built APK from `dist/AsiaUSTrader-debug.apk`).

            - `package`: `com.asiaproxy.trader`
            - `versionName`: 1.1
            - `minSdkVersion`: 26 (Android 8.0+)
            - `targetSdkVersion`: 23
            - signed with v2 + v3 schemes (debug keystore — sideload only)

            Install on a device:

            ```
            adb install -r AsiaUSTrader-${{ steps.meta.outputs.tag }}.apk
            ```

            Built locally with `build.sh` (no Gradle / AGP — see README for the toolchain). To rebuild from source on a workstation, run `./build.sh` after installing the apt tools listed in the README.
