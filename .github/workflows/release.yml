name: Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: true
        default: 'v1.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build tools (Ubuntu apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-platform-23 \
            libandroid-23-java \
            aapt \
            apksigner \
            zipalign \
            dalvik-exchange \
            ecj
          which aapt2 zipalign apksigner ecj
          ls /usr/lib/android-sdk/build-tools/debian/dx
          ls /usr/lib/android-sdk/platforms/android-23/android.jar

      - name: Build APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify APK
        run: |
          apksigner verify --verbose dist/AsiaUSTrader-debug.apk
          aapt dump badging dist/AsiaUSTrader-debug.apk | head -10
          ls -lh dist/AsiaUSTrader-debug.apk

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/heads/release-v* ]]; then
            TAG="${GITHUB_REF#refs/heads/release-}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          fi
          OUT="dist/AsiaUSTrader-${TAG}.apk"
          cp dist/AsiaUSTrader-debug.apk "${OUT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsiaUSTrader-${{ steps.meta.outputs.tag }}
          path: ${{ steps.meta.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Asia → US Trader ${{ steps.meta.outputs.tag }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.meta.outputs.apk_path }}
          generate_release_notes: true
          body: |
            **Asia → US Trader** debug build.

            - `package`: `com.asiaproxy.trader`
            - `versionName`: 1.1
            - `minSdkVersion`: 26 (Android 8.0+)
            - `targetSdkVersion`: 23
            - signed with v2 + v3 schemes (debug keystore — for sideloading only)

            Install on a device:

            ```
            adb install -r AsiaUSTrader-${{ steps.meta.outputs.tag }}.apk
            ```

            Built end-to-end with `build.sh` (no Gradle / AGP — see README for the toolchain).
